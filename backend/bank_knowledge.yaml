    description: 工商银行企业网银标准导出格式截图，表头在第6行、账号在B4单元格，收入列在支出列前面（第4列为收入，第5列为支出）
    file_path: screenshots/icbc_template.png
    upload_date: '2026-06-16'
    config_version: '1.0'
    notes: 已验证该模板与 bank_rules.yaml 中工商银行配置完全匹配，注意收入支出列顺序与其他银行相反
  column_descriptions:
  - field_key: trade_date
    display_name: 交易日期
    description: 交易发生日期
    example_values:
    - '2024-01-15'
    pitfalls: []
  - field_key: payment
    display_name: 支出金额
    description: 资金流出的交易金额
    example_values:
    - '5000.00'
    pitfalls:
    - 工商银行支出和收入列的顺序与部分银行相反（先收入后支出）
  - field_key: receipt
    display_name: 收入金额
    description: 资金流入的交易金额
    example_values:
    - '3000.00'
    pitfalls:
    - 收入列在第4列，支出列在第5列，注意不要混淆
  - field_key: summary
    display_name: 摘要
    description: 交易摘要信息
    example_values:
    - 转账
    pitfalls: []
  - field_key: counterpart
    display_name: 对方户名
    description: 交易对方的账户名称
    example_values:
    - 某某公司
    pitfalls: []
  - field_key: balance
    display_name: 余额
    description: 交易后的账户余额
    example_values:
    - '125000.00'
    pitfalls: []
  - field_key: transaction_id
    display_name: 交易流水号
    description: 唯一标识该笔交易的流水号
    example_values:
    - 'ICBC202401150001'
    pitfalls: []
  known_issues:
  - issue_id: icbc_payment_receipt_swap
    title: 工商银行收入支出列顺序反直觉
    description: 工商银行导出模板中收入金额在第4列、支出金额在第5列，
      与常见的先支出后收入顺序相反，容易在手动配置时混淆
    symptoms:
    - 收入金额全为0或负数
    - 支出金额全为0或负数
    - 余额计算异常
    root_cause: 工商银行导出模板列顺序为先收入后支出，与部分银行相反
    fix_steps:
    - 检查 bank_rules.yaml 中工商银行的列映射
    - 确认 receipt 映射到第4列、payment 映射到第5列
    - 不要手动交换列映射，程序已正确处理
    error_patterns:
    - 收入.*支出.*反.*工商
    - 金额.*负数.*工商银行
    - payment.*receipt.*swap
    severity: info
    config_version: '1.0'
    last_seen_date: '2026-05-15'
    tags:
    - 列顺序
    - 工商银行
  - issue_id: icbc_multi_sheet
    title: 工商银行多工作表文件
    description: 工商银行部分导出文件包含多个工作表，数据可能不在第一个工作表中
    symptoms:
    - 解析结果为空
    - 提示"未检测到有效数据"
    - 总表行数为0
    root_cause: 工商银行网银系统可能在同一文件中导出多个账户的数据到不同工作表
    fix_steps:
    - 打开文件检查工作表列表
    - 确认数据所在的工作表名称
    - 如需处理多工作表，配置 multi_account 或 skip_sheets 选项
    - 重新运行流水处理
    error_patterns:
    - 工商银行.*空.*工作表
    - multi.*sheet.*icbc
    - 数据为空.*工商
    severity: warning
    config_version: '1.0'
    last_seen_date: '2026-04-20'
    tags:
    - 多工作表
    - 工商银行
  general_pitfalls:
  - 工商银行收入列在第4列，支出列在第5列，顺序与常见模板相反
  - 数据起始行在第6行，需注意前面的行不要被当作数据处理
  - 账号位于B4单元格，位置偏下
  notes: ''
  tags:
  - 企业网银
  - xlsx

