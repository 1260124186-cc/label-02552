    type: transfer
    keywords:
      - 信用卡还款
      - 还信用卡
      - 花呗还款
      - 白条还款
    exclude_from_stats: true

  # 账户间转账 - 不计入收支
  - name: 账户转账
    type: transfer
    keywords:
      - 转账到
      - 从...转账
      - 余额宝
      - 零钱通
      - 理财通
      - 转入
      - 转出
    exclude_from_stats: true
