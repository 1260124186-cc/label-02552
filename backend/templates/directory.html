<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银企直连目录对接管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .status-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .status-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .status-item .count {
            font-size: 32px;
            font-weight: bold;
            color: #007bff;
        }
        .status-item .label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .bank-list {
            list-style: none;
            padding: 0;
        }
        .bank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .bank-item .bank-name {
            font-weight: 600;
        }
        .bank-item .bank-status {
            font-size: 12px;
            color: #28a745;
        }
        .bank-item.enabled .bank-status {
            color: #28a745;
        }
        .bank-item.disabled .bank-status {
            color: #dc3545;
        }
        .file-list {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 6px;
            padding: 10px;
        }
        .file-item {
            padding: 6px 10px;
            margin-bottom: 4px;
            background: #fff;
            border-radius: 4px;
            font-size: 13px;
            font-family: monospace;
        }
        .archive-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .archive-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .archive-info {
            flex: 1;
        }
        .archive-info .timestamp {
            font-weight: 600;
            font-family: monospace;
        }
        .archive-info .meta {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-right: 5px;
        }
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        .badge-error {
            background: #f8d7da;
            color: #721c24;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .log-viewer {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin-bottom: 4px;
        }
        .log-entry .time {
            color: #6a9955;
        }
        .log-entry .level-info {
            color: #569cd6;
        }
        .log-entry .level-error {
            color: #f44747;
        }
        .log-entry .level-warn {
            color: #dcdcaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>银企直连目录对接管理</h1>
            <nav>
                <a href="{{ url_for('upload_page') }}">文件上传</a>
                <a href="{{ url_for('counterparty_rules_page') }}">对方户名规则</a>
                <a href="{{ url_for('voucher_attachments_page') }}">凭证附件</a>
                <a href="{{ url_for('dashboard_page') }}">数据看板</a>
                <a href="{{ url_for('directory_page') }}" class="active">目录对接</a>
            </nav>
        </header>

        {% if not has_directory_connector %}
        <div class="status-card" style="border-left: 4px solid #ffc107;">
            <h3>⚠️  模块不可用</h3>
            <p>目录对接模块未正确加载，请确保 bank_directory_connector.py 文件存在且配置正确。</p>
        </div>
        {% else %}
        <div class="action-buttons">
            <button onclick="refreshStatus()" class="btn">刷新状态</button>
            <button onclick="runDirectory()" class="btn btn-primary">立即处理</button>
            <button onclick="showDownloadModal()" class="btn btn-success">触发下载</button>
        </div>

        <div class="status-card">
            <h2>当前状态</h2>
            <div id="status-grid" style="display: none;">
                <div class="status-item">
                    <div class="count" id="inbox-count">-</div>
                    <div class="label">待处理文件</div>
                </div>
                <div class="status-item">
                    <div class="count" id="outbox-count">-</div>
                    <div class="label">已处理</div>
                </div>
                <div class="status-item">
                    <div class="count" id="error-count">-</div>
                    <div class="label">错误文件</div>
                </div>
                <div class="status-item">
                    <div class="count" id="ready-count">-</div>
                    <div class="label">可处理中</div>
                </div>
            </div>
        </div>

        <div class="status-card">
            <h3>根目录</h3>
            <code id="root-dir" style="background: #f8f9fa; padding: 10px; border-radius: 4px; display: block;">-</code>
        </div>

        <div class="status-card">
            <h3>已配置银行</h3>
            <ul id="bank-list" class="bank-list">
                <li class="bank-item">
                    <span class="bank-name">加载中...</span>
                </li>
            </ul>
        </div>

        <div class="status-card">
            <h3>待处理文件</h3>
            <div id="pending-files" class="file-list">
                <div class="file-item">加载中...</div>
            </div>
        </div>

        <div class="status-card">
            <h3>历史归档</h3>
            <div id="archive-list" class="archive-list">
                <div class="archive-item">
                <span>加载中...</span>
                </div>
            </div>
        </div>

        <div class="status-card">
            <h3>处理日志</h3>
            <div id="log-viewer" class="log-viewer">
                <div class="log-entry"><span class="time">[系统]</span> 等待处理...</div>
            </div>
        </div>
        {% endif %}
    </div>

    <div id="download-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #fff; padding: 30px; border-radius: 8px; max-width: 400px; width: 90%;">
            <h3>选择银行</h3>
            <select id="bank-select" style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px;">
            </select>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="hideDownloadModal()" class="btn">取消</button>
                <button onclick="triggerDownload()" class="btn btn-primary">开始下载</button>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let currentTaskId = null;

        function refreshStatus() {
            fetch('/api/directory/status')
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.data) {
                        const d = data.data;
                        document.getElementById('inbox-count').textContent = d.inbox_count;
                        document.getElementById('outbox-count').textContent = d.outbox_count;
                        document.getElementById('error-count').textContent = d.error_count;
                        document.getElementById('ready-count').textContent = d.ready_files ? d.ready_files.length : 0;
                        document.getElementById('root-dir').textContent = d.root_dir;
                        document.getElementById('status-grid').style.display = 'grid';

                        const bankList = document.getElementById('bank-list');
                        bankList.innerHTML = '';
                        d.configured_banks.forEach(bank => {
                            const li = document.createElement('li');
                            li.className = 'bank-item ' + (bank.enabled ? 'enabled' : 'disabled');
                            li.innerHTML = `
                                <span class="bank-name">${bank.name}</span>
                                <span>
                                    <span class="bank-status">${bank.enabled ? '✓ 已启用' : '✗ 已禁用'}</span>
                                    ${bank.has_download_script ? '<span class="badge badge-success">可下载</span>' : ''}
                                </span>
                            `;
                            bankList.appendChild(li);
                        });

                        const pendingFiles = document.getElementById('pending-files');
                        if (d.pending_files && d.pending_files.length > 0) {
                            pendingFiles.innerHTML = '';
                            d.pending_files.forEach(f => {
                                const div = document.createElement('div');
                                div.className = 'file-item';
                                div.textContent = f;
                                const isReady = d.ready_files && d.ready_files.includes(f);
                                if (!isReady) {
                                    div.style.opacity = '0.6';
                                    div.innerHTML += ' <span style="color: #ffc107;">(等待中)</span>';
                                }
                                pendingFiles.appendChild(div);
                            });
                        } else {
                            pendingFiles.innerHTML = '<div class="file-item" style="color: #999;">暂无待处理文件</div>';
                        }

                        const bankSelect = document.getElementById('bank-select');
                        bankSelect.innerHTML = '';
                        d.configured_banks.filter(b => b.enabled && b.has_download_script).forEach(bank => {
                            const option = document.createElement('option');
                            option.value = bank.name;
                            option.textContent = bank.name;
                            bankSelect.appendChild(option);
                        });
                        if (bankSelect.options.length === 0) {
                            const option = document.createElement('option');
                            option.value = '';
                            option.textContent = '暂无可下载的银行';
                            option.disabled = true;
                            bankSelect.appendChild(option);
                        }

                        refreshArchives();
                    }
                })
                .catch(e => {
                    console.error('刷新状态失败:', e);
                    addLog('error', '刷新状态失败: ' + e.message);
                });
        }

        function refreshArchives() {
            fetch('/api/directory/archives')
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.data) {
                        const archiveList = document.getElementById('archive-list');
                        if (data.data.length === 0) {
                            archiveList.innerHTML = '<div class="archive-item"><span style="color: #999;">暂无归档记录</span></div>';
                            return;
                        }

                        archiveList.innerHTML = '';
                        data.data.forEach(archive => {
                            const div = document.createElement('div');
                            div.className = 'archive-item';
                            const badges = [];
                            if (archive.error_files > 0) {
                                badges.push(`<span class="badge badge-error">${archive.error_files} 错误</span>`);
                            }
                            if (archive.processed_files > 0) {
                                badges.push(`<span class="badge badge-success">${archive.processed_files} 文件</span>`);
                            }
                            badges.push(`<span>${archive.total_records} 条记录</span>`);

                            let downloadBtn = '';
                            if (archive.has_output) {
                                downloadBtn = `<button onclick="downloadArchive('${archive.timestamp}')" class="btn btn-sm">下载</button>';
                            }

                            div.innerHTML = `
                                <div class="archive-info">
                                    <div class="timestamp">${archive.timestamp}</div>
                                    <div class="meta">${archive.created_at} · ${badges.join(' ')}</div>
                                </div>
                                <div>${downloadBtn}</div>
                            `;
                            archiveList.appendChild(div);
                        });
                    }
                })
                .catch(e => {
                    console.error('加载归档失败:', e);
                });
        }

        function runDirectory() {
            if (currentTaskId) {
                alert('已有任务在处理中，请等待完成');
                return;
            }

            addLog('info', '开始处理目录...');

            fetch('/api/directory/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ incremental: true })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        currentTaskId = data.task_id;
                        addLog('info', '任务已启动，ID: ' + data.task_id);
                        startSSE(data.task_id);
                    } else {
                        addLog('error', '启动失败: ' + data.message);
                    }
                })
                .catch(e => {
                    addLog('error', '请求失败: ' + e.message);
                });
        }

        function startSSE(taskId) {
            eventSource = new EventSource('/api/task/' + taskId + '/events');
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                console.log('SSE消息:', data);

                if (data.type === 'completed' || data.type === 'error') {
                    if (data.data && data.data.message) {
                        addLog(data.type === 'completed' && data.status === 'completed' ? 'info' : 'error',
                               data.data.message);
                    }
                    currentTaskId = null;
                    eventSource.close();
                    eventSource = null;
                    setTimeout(refreshStatus, 1000);
                }
            };
            eventSource.onerror = function(e) {
                console.error('SSE错误:', e);
                addLog('warn', '连接断开');
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
                currentTaskId = null;
            };
        }

        function showDownloadModal() {
            document.getElementById('download-modal').style.display = 'flex';
        }

        function hideDownloadModal() {
            document.getElementById('download-modal').style.display = 'none';
        }

        function triggerDownload() {
            const bankName = document.getElementById('bank-select').value;
            if (!bankName) {
                alert('请选择银行');
                return;
            }

            hideDownloadModal();
            addLog('info', '开始下载 ' + bankName + ' 流水...');

            fetch('/api/directory/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bank_name: bankName })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        addLog('info', data.message);
                        setTimeout(refreshStatus, 2000);
                    } else {
                        addLog('error', '下载失败: ' + data.message);
                    }
                })
                .catch(e => {
                    addLog('error', '请求失败: ' + e.message);
                });
        }

        function downloadArchive(timestamp) {
            window.location.href = '/api/directory/archive/' + timestamp + '/download?type=summary';
        }

        function addLog(level, message) {
            const viewer = document.getElementById('log-viewer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="level-${level}">[${level.toUpperCase()}]</span> ${message}`;
            viewer.appendChild(entry);
            viewer.scrollTop = viewer.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', function() {
            refreshStatus();
            setInterval(refreshStatus, 30000);
        });

        document.getElementById('download-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideDownloadModal();
            }
        });
    </script>
</body>
</html>
