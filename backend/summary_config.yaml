# 银行流水总表导出配置
# 允许用户自定义总表列顺序、是否输出某些列，以及 Excel 表头样式

# ──────────────────────────────────────────────
# 列配置
# ──────────────────────────────────────────────
columns:
  # 列顺序：按此列表顺序输出列
  # 可以调整顺序，也可以注释掉不需要的列
  order:
    - 唯一id
    - 银行
    - 银行账号
    - 主体
    - 交易日期
    - 付款
    - 收款
    - 摘要
    - 对方户名
    - 对方账号
    - 余额
    - 交易流水号
    - 票据号
    - 结算号
    - 凭证号
    - 异常标记
    - 异常详情

  # 可选列开关：false 表示即使数据中存在该列也不输出
  # 列名必须与 order 列表中的名称一致
  enabled:
    唯一id: true
    银行: true
    银行账号: true
    主体: true
    交易日期: true
    付款: true
    收款: true
    摘要: true
    对方户名: true
    对方账号: true
    余额: true
    交易流水号: true
    票据号: true
    结算号: true
    凭证号: true
    异常标记: true
    异常详情: true

# ──────────────────────────────────────────────
# Excel 样式配置
# ──────────────────────────────────────────────
excel_style:
  # 是否冻结首行（表头），默认 true
  freeze_header: true

  # 列宽自适应配置
  auto_column_width:
    # 是否启用列宽自适应，默认 true
    enabled: true
    # 最小列宽（字符数）
    min_width: 8
    # 最大列宽（字符数）
    max_width: 50
    # 列宽余量（额外增加的字符数）
    padding: 2
