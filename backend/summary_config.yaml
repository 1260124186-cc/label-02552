# 银行流水总表导出配置
# 允许用户自定义总表列顺序、是否输出某些列，以及 Excel 表头样式

# ──────────────────────────────────────────────
# 列配置
# ──────────────────────────────────────────────
columns:
  # 列顺序：按此列表顺序输出列
  # 可以调整顺序，也可以注释掉不需要的列
  order:
    - 唯一id
    - 银行
    - 银行账号
    - 主体
    - 交易日期
    - 付款
    - 收款
    - 摘要
    - 对方户名
    - 对方账号
    - 余额
    - 交易流水号
    - 票据号
    - 结算号
    - 凭证号
    - 异常标记
    - 异常详情

  # 可选列开关：false 表示即使数据中存在该列也不输出
  # 列名必须与 order 列表中的名称一致
  enabled:
    唯一id: true
    银行: true
    银行账号: true
    主体: true
    交易日期: true
    付款: true
    收款: true
    摘要: true
    对方户名: true
    对方账号: true
    余额: true
    交易流水号: true
    票据号: true
    结算号: true
    凭证号: true
    异常标记: true
    异常详情: true

# ──────────────────────────────────────────────
# 派生列配置
# ──────────────────────────────────────────────
# 在总表中追加由轻量计算生成的列，不影响银行原始解析规则。
# 内置计算器：
#   net_amount            净额（收款 + 付款合计，付款约定为负数）
#   transaction_direction 交易方向（收入/支出/无流向）
#   accounting_period     会计期间（按 bank_rules.yaml 中 accounting_period 节规则归属）
# 启用后，派生列名会自动加入 columns.order 和 columns.enabled，
# 可在其中调整顺序或关闭输出。

derived_columns:
  - name: 净额
    calculator: net_amount
    enabled: false

  - name: 交易方向
    calculator: transaction_direction
    enabled: false

  - name: 会计期间
    calculator: accounting_period
    enabled: false

# ──────────────────────────────────────────────
# Excel 样式配置
# ──────────────────────────────────────────────
excel_style:
  # 是否冻结首行（表头），默认 true
  freeze_header: true

  # 列宽自适应配置
  auto_column_width:
    # 是否启用列宽自适应，默认 true
    enabled: true
    # 最小列宽（字符数）
    min_width: 8
    # 最大列宽（字符数）
    max_width: 50
    # 列宽余量（额外增加的字符数）
    padding: 2
